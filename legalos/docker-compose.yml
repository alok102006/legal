services:
  db:
    image: postgres:15-alpine
    container_name: legalos_db
    restart: always
    environment:
      POSTGRES_USER: legalos
      POSTGRES_PASSWORD: legalos_secure_password
      POSTGRES_DB: legalos
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legalos -d legalos"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: legalos_qdrant
    restart: always
    ports:
      - "6335:6333"
      - "6336:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    image: legalos-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: legalos_backend
    restart: always
    # Hot reload watches only app code (editing tests/docs must not restart the server and kill running jobs)
    command: ["sh", "-c", "alembic upgrade head || echo '!!! MIGRATION FAILED - see error above !!!'; uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app"]
    environment:
      - DATABASE_URL=postgresql+asyncpg://legalos:legalos_secure_password@db:5432/legalos
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_API_KEY=
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_API_KEYS=${GEMINI_API_KEYS:-}
      - GEMINI_FALLBACK_MODELS=${GEMINI_FALLBACK_MODELS:-gemini-3.5-flash-lite,gemini-3.5-flash}
      - LLM_PROVIDER=gemini
      - GST_API_PROVIDER=${GST_API_PROVIDER:-}
      - GST_API_KEY=${GST_API_KEY:-}
      - GST_API_SECRET=${GST_API_SECRET:-}
      - GST_API_BASE_URL=${GST_API_BASE_URL:-}
      - GST_API_KEY_HEADER=${GST_API_KEY_HEADER:-}
      - FRONTEND_URL=http://localhost:5173
      - HF_HOME=/app/model_cache
      - SENTENCE_TRANSFORMERS_HOME=/app/model_cache
    ports:
      - "${BACKEND_PORT:-8000}:8000"     # set BACKEND_PORT in .env if 8000 is taken by another project
    volumes:
      - model_cache:/app/model_cache
      # Mount source code for local dev reload
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_started

  frontend:
    image: legalos-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: legalos_frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:${BACKEND_PORT:-8000}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  qdrant_data:
  model_cache:
