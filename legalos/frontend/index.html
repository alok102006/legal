    <script>
      // Apply the saved theme before first paint (no flash). Falls back to the OS setting via CSS.
      try {
        var t = localStorage.getItem('legalos_theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
